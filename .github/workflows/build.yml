EOF
          fi

      - name: Build Debug APK
        run: |
          if [ -x ./gradlew ]; then
            ./gradlew assembleDebug --stacktrace --no-daemon -Djava.awt.headless=true -Dksp.incremental=false --max-workers=2 || gradle assembleDebug --stacktrace --no-daemon -Djava.awt.headless=true -Dksp.incremental=false --max-workers=2
          else
            gradle assembleDebug --stacktrace --no-daemon -Djava.awt.headless=true -Dksp.incremental=false --max-workers=2
          fi
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Djava.awt.headless=true"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error



