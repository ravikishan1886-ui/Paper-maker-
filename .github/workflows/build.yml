name: Build APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36'

      - name: Accept Android SDK Licenses
        run: |
          yes | ${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager --licenses || true
          yes | sdkmanager --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
          cache-disabled: false

      - name: Prepare Keystore, Google Services and Environment
        run: |
          # 1. Decode debug keystore
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

          # 2. Setup .env
          if [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
          fi

          # 3. Setup app/google-services.json
          if [ ! -f app/google-services.json ]; then
            cat << 'EOF' > app/google-services.json
{
  "project_info": {
    "project_number": "995356758986",
    "firebase_url": "https://apt-terrain-496609-g7-default-rtdb.firebaseio.com",
    "project_id": "apt-terrain-496609-g7",
    "storage_bucket": "apt-terrain-496609-g7.firebasestorage.app"
  },
  "client": [
    {
      "client_info": {
        "mobilesdk_app_id": "1:995356758986:android:d6fd606decbe444dd07533",
        "android_client_info": {
          "package_name": "com.aistudio.papergenius.qgen"
        }
      },
      "oauth_client": [
        {
          "client_id": "995356758986-06n60bub4ugdm8o81cagu8emj0rqp89c.apps.googleusercontent.com",
          "client_type": 1,
          "android_info": {
            "package_name": "com.aistudio.papergenius.qgen",
            "certificate_hash": "0db9309e67fad9ba3a45de200e72d42e2dc1329f"
          }
        },
        {
          "client_id": "995356758986-gj5v0ev7rbvuk5ub3516tnp06id9fq3o.apps.googleusercontent.com",
          "client_type": 3
        }
      ],
      "api_key": [
        {
          "current_key": "AIzaSyD258KCA9nd0kzog3f9vJOZ2DLUS_D1bxg"
        }
      ],
      "services": {
        "appinvite_service": {
          "other_platform_oauth_client": [
            {
              "client_id": "995356758986-gj5v0ev7rbvuk5ub3516tnp06id9fq3o.apps.googleusercontent.com",
              "client_type": 3
            }
          ]
        }
      }
    }
  ],
  "configuration_version": "1"
}
EOF
          fi

          # 4. Enforce headless JVM and non-incremental KSP in gradle.properties
          if [ -f gradle.properties ]; then
            sed -i 's/-Xmx4g/-Xmx2048m -Djava.awt.headless=true/g' gradle.properties || true
            grep -q "java.awt.headless" gradle.properties || echo "org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -Djava.awt.headless=true" >> gradle.properties
            grep -q "ksp.incremental" gradle.properties || echo "ksp.incremental=false" >> gradle.properties
            grep -q "ksp.incremental.intermodule" gradle.properties || echo "ksp.incremental.intermodule=false" >> gradle.properties
            grep -q "kotlin.daemon.jvmargs" gradle.properties || echo "kotlin.daemon.jvmargs=-Djava.awt.headless=true" >> gradle.properties
          fi

          # 5. Ensure gradlew exists and is executable
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 9.3.1
          fi
          sed -i 's/\r$//' gradlew || true
          chmod +x gradlew || true

      - name: Build Debug APK
        run: |
          ./gradlew assembleDebug --stacktrace --no-daemon -Djava.awt.headless=true -Dksp.incremental=false --max-workers=2 || gradle assembleDebug --stacktrace --no-daemon -Djava.awt.headless=true -Dksp.incremental=false --max-workers=2
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Djava.awt.headless=true"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error




